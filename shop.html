<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Issue 001 — guerrillagrotto.space</title>

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --muted:#777;
      --stroke:1px;
      --cursor-stroke:1.6px;
      --plus-size:16px;
      --phrase-gap:12ch;
      --text-size:12px;
      --btn-red:#ff3b30;
    }

    html,body{height:100%;}
    *{box-sizing:border-box;}

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      cursor:none;
      overflow:auto;
      position:relative;
    }
    body *{cursor:none;}

    /* ======================
       BACKGROUND VIDEO
    ====================== */
    .bg-video{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      object-fit:cover;
      z-index:-2;
    }
    .bg-video-overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      z-index:-1;
      pointer-events:none;
    }

    /* ======================
       CURSOR
    ====================== */
    .cursor-plus{
      position:fixed;
      left:0; top:0;
      width:0; height:0;
      z-index:1000;
      pointer-events:none;
    }
    .cursor-plus::before,
    .cursor-plus::after{
      content:"";
      position:absolute;
      left:0; top:0;
      border:var(--cursor-stroke) solid currentColor;
      transform:translate(-50%, -50%);
    }
    .cursor-plus::before{width:calc(var(--plus-size)*2);}
    .cursor-plus::after{height:calc(var(--plus-size)*2);}

    /* ======================
       NAV
    ====================== */
    .site-nav{
      position:fixed;
      top:40px;
      left:12px;
      z-index:30;
      font-size:var(--text-size);
    }
    .site-nav a{
      color:inherit;
      text-decoration:none;
      border-bottom:var(--stroke) solid transparent;
    }
    .site-nav a:hover{border-color:currentColor;}

    /* ======================
       MARQUEES
    ====================== */
    .marquee-wrap{
      position:fixed;
      left:0; right:0;
      user-select:none;
      z-index:20;
      pointer-events:none;
    }
    .marquee-wrap.top{top:0; padding-top:8px;}
    .marquee-wrap.bottom{bottom:0; padding-bottom:8px;}

    .marquee{
      display:flex;
      white-space:nowrap;
      gap:var(--phrase-gap);
      animation:scroll 18s linear infinite;
      font-size:var(--text-size);
    }
    .marquee .chunk{display:flex; gap:var(--phrase-gap);}
    @keyframes scroll{
      from{transform:translateX(0);}
      to{transform:translateX(-50%);}
    }
    .marquee-wrap.top .marquee{animation-direction:reverse;}

    /* ======================
       MAIN
    ====================== */
    .stage{
      padding:120px 16px 100px;
      display:flex;
      justify-content:center;
      min-height:100vh;
      z-index:10;
      position:relative;
    }

    .frame{
      border:var(--stroke) solid currentColor;
      padding:28px;
      width:90vw;
      max-width:740px;
      background:rgba(0,0,0,0.15);
      backdrop-filter:blur(2px);
    }

    .title{
      font-style:italic;
      font-size:14px;
      margin:0 0 6px;
    }

    .sub{
      color:var(--muted);
      font-size:10px;
      letter-spacing:.1em;
      text-transform:uppercase;
      margin-bottom:18px;
    }

    p{
      font-size:var(--text-size);
      line-height:1.6;
      margin:0 0 14px;
    }

    ul{
      padding-left:14px;
      margin:0 0 18px;
      font-size:var(--text-size);
    }
    li{margin:6px 0;}

    /* ======================
       RED EMAIL BUTTON
    ====================== */
    .btn{
      border:var(--stroke) solid var(--btn-red);
      color:var(--btn-red);
      text-decoration:none;
      text-transform:uppercase;
      font-size:var(--text-size);
      letter-spacing:.12em;
      padding:10px 14px;
      display:inline-block;
    }
    .btn:hover{
      background:var(--btn-red);
      color:#000;
    }

    @media(max-width:768px){
      .btn{width:100%; text-align:center;}
    }
  </style>
</head>

<body>

  <!-- Background video -->
  <video class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="ggshop.mp4" type="video/mp4">
  </video>
  <div class="bg-video-overlay"></div>

  <!-- Cursor -->
  <div id="cursor" class="cursor-plus"></div>

  <!-- Nav -->
  <div class="site-nav">
    <a href="index.html">◀ back to grotto</a>
  </div>

  <!-- Top marquee -->
  <div class="marquee-wrap top">
    <div id="marqueeTop" class="marquee"></div>
  </div>

  <main class="stage">
    <section class="frame">

      <h1 class="title"><em>Issue 001</em></h1>
      <div class="sub">(berkeley, ca — guerrilla furniture)</div>

      <p>
        Eight builds. Built with purpose. Built without permission.
      </p>

      <ul>
        <li>complete the circuit</li>
        <li>claim a  mug</li>
        <li>receive the final location</li>
      </ul>


      <a class="btn"
        href="mailto:bluetilespace@gmail.com?subject=Issue%20001&body=Click%20send%20to%20receive%20instructions.">
        start
      </a>

    </section>
  </main>

  <!-- Bottom marquee -->
  <div class="marquee-wrap bottom">
    <div id="marqueeBottom" class="marquee"></div>
  </div>

  <script>
    /* Cursor */
    const cursor = document.getElementById("cursor");
    window.addEventListener("mousemove", (e) => {
      cursor.style.transform = `translate(${e.clientX}px,${e.clientY}px)`;
    });

    /* Marquees */
    const marqueeTop = document.getElementById("marqueeTop");
    const marqueeBottom = document.getElementById("marqueeBottom");

    function attach(target, text){
      const a = document.createElement("div");
      a.className = "chunk";
      a.textContent = text;
      const b = a.cloneNode(true);
      target.append(a, b);
    }

    attach(marqueeTop, "Issue 001 — 8 builds — built with purpose — without permission");
    attach(marqueeBottom, "find them all — claim a mug");
  </script>

</body>
</html>
